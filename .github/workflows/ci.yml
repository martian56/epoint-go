name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24", "1.25"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -short ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Start the epoint sandbox
        run: |
          docker run -d --name sandbox -p 8181:8181 ghcr.io/martian56/epoint-sandbox:latest
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8181/api/heartbeat > /dev/null; then
              echo "sandbox is up"
              exit 0
            fi
            sleep 2
          done
          echo "sandbox did not become healthy"
          docker logs sandbox
          exit 1
      - run: go test ./...
        env:
          EPOINT_BASE_URL: http://localhost:8181
